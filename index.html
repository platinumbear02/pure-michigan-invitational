          <div className="singles-list">
            {ARCHIVE_2025.singles.map((m,i)=>(
              <div key={i} className="singles-row">
                <span className={`sr-player ${m.winner==="USA"?"sr-win":"sr-lose"}`} style={{color:m.winner==="USA"?"#e0556a":"var(--muted)"}}>
                  {m.winner==="USA"&&<span className="sr-trophy">🏆</span>}{m.usa}
                </span>
                <span className="sr-result">{m.result}</span>
                <span className={`sr-player sr-player-r ${m.winner==="EUR"?"sr-win":"sr-lose"}`} style={{color:m.winner==="EUR"?"#FFCD00":"var(--muted)"}}>
                  {m.eur}{m.winner==="EUR"&&<span className="sr-trophy">🏆</span>}
                </span>
              </div>
            ))}
          </div>
        </div>
      )}

      {sub==="skins"&&(
        <div>
          <div className="card" style={{marginBottom:10}}>
            <div className="card-title">🟡 Sunday Gross Skins · $125 pot</div>
            {ARCHIVE_2025.skins.map((s,i)=>(
              <div key={i} className="arch-skin-row">
                <span className="ars-name" style={{color:nameColor(s.team)}}>{s.name}</span>
                <span className="ars-count">{s.skins} skin{s.skins>1?"s":""}</span>
                <span className="ars-detail">{s.detail}</span>
                <span className="ars-purse">{s.purse}</span>
              </div>
            ))}
            <div className="arch-skin-total">Total Purse Allocated: $125.00</div>
          </div>
          <div className="card">
            <div className="card-title">🔵 Sunday Net Skins · $125 pot</div>
            {ARCHIVE_2025.netSkins.map((s,i)=>(
              <div key={i} className="arch-skin-row">
                <span className="ars-name" style={{color:nameColor(s.team)}}>{s.name}</span>
                <span className="ars-count">{s.skins} skin{s.skins>1?"s":""}</span>
                <span className="ars-detail">{s.detail}</span>
                <span className="ars-purse">{s.purse}</span>
              </div>
            ))}
            <div className="arch-skin-total">Total Purse Allocated: $125.00</div>
          </div>
        </div>
      )}

      {sub==="greenies"&&(
        <div className="card">
          <div className="card-title">🟢 Sunday Greenies · $25 each</div>
          {ARCHIVE_2025.greenies.map((g,i)=>(
            <div key={i} className="arch-skin-row" style={{gridTemplateColumns:"1fr auto"}}>
              <span className="ars-name" style={{color:nameColor(g.team)}}>{g.name}</span>
              <span className="ars-purse">{g.purse}</span>
            </div>
          ))}
          <div className="arch-skin-total">Total Purse Allocated: $50.00</div>
        </div>
      )}

      {sub==="awards"&&(
        <div>
          <div className="award-section">
            <div className="award-card mvg-card">
              <div className="award-head">
                <span className="award-emoji">🏅</span>
                <div>
                  <div className="award-title">MVG Front-Runners</div>
                  <div className="award-sub">Computed from official results</div>
                </div>
              </div>
              {awards.mvg.map((p,idx)=>(
                <div key={p.name} className={`award-row ${idx===0?"award-row-lead":""}`}>
                  <span className="award-pos">{idx+1}</span>
                  <span className="award-name" style={{color:nameColor(p.team)}}>
                    {p.name}{p.team===awards.cupWinner?<span className="award-trophy">🏆</span>:<span className="award-x">✗</span>}
                  </span>
                  <span className="award-detail-stats">
                    {p.grossPos&&<span className="ads-chip">G#{p.grossPos}</span>}
                    {p.singlesW>0&&<span className="ads-chip">{p.singlesW}W singles</span>}
                    {(p.skins+p.netSkins)>0&&<span className="ads-chip">🎯{p.skins+p.netSkins}</span>}
                  </span>
                  <span className="award-score">{p.mvgScore}</span>
                </div>
              ))}
            </div>

            <div className="award-card rat-card">
              <div className="award-head">
                <span className="award-emoji">🥴</span>
                <div>
                  <div className="award-title">Ratliff Front-Runners</div>
                  <div className="award-sub">Computed from official results</div>
                </div>
              </div>
              {awards.ratliff.map((p,idx)=>(
                <div key={p.name} className={`award-row ${idx===0?"award-row-lead-rat":""}`}>
                  <span className="award-pos">{idx+1}</span>
                  <span className="award-name" style={{color:nameColor(p.team)}}>
                    {p.name}{p.team===awards.cupWinner?<span className="award-trophy">🏆</span>:<span className="award-x">✗</span>}
                  </span>
                  <span className="award-detail-stats">
                    {p.grossPos&&<span className="ads-chip-bad">G#{p.grossPos}</span>}
                    {p.singlesL>0&&<span className="ads-chip-bad">{p.singlesL}L singles</span>}
                  </span>
                  <span className="award-score-bad">{p.ratScore}</span>
                </div>
              ))}
            </div>
          </div>
          <p className="rt-note" style={{marginTop:10}}>🏅 MVG score rewards low gross/net finish, singles wins, skins, and being on the winning team. 🥴 Ratliff rewards poor finishes and singles losses. These are <strong>suggestions to guide voting</strong> — the group still picks the winners. (2025 actual voted winners: Vassas won MVG, Kevin won Ratliff.)</p>
        </div>
      )}

      <p className="rt-note" style={{marginTop:10}}>📊 Pulled live from the official Golf Genius portal. R1 Thu 4-Ball · R2 Fri 4-Ball · R3 Sat Scramble · (Sun Singles tracked separately). This is a proof of concept for auto-importing 2026 results.</p>
    </div>
  );
}

function HistoryPage() {
  const [showArchive,setShowArchive]=useState(false);
  const usaW=HISTORY.filter(isUSAWin).length, eurW=HISTORY.length-usaW;
  if(showArchive) return (
    <div>
      <button className="back-btn" onClick={()=>setShowArchive(false)}>← Back to History</button>
      <Archive2025/>
    </div>
  );
  const cr=[...allPlayers()].map(p=>({...p,c:CAREER[p.id]})).filter(p=>p.c).sort((a,b)=>b.c.titles-a.c.titles);
  const pr=[...allPlayers()].map(p=>({...p,c:CAREER[p.id]})).filter(p=>p.c&&p.c.years>=3).map(p=>({...p,pct:winPct(p.c.w,p.c.l,p.c.t)})).sort((a,b)=>b.pct-a.pct);
  return (
    <div>
      <div className="series-hero">
        <div className="sh-title">All-Time Series · Est. 2011</div>
        <div className="sh-row">
          <div className="sh-team"><div className="sh-flag">🇺🇸</div><div className="sh-tname">USA</div><div className="sh-score" style={{color:"#B22234"}}>{usaW}</div></div>
          <div className="sh-div">VS</div>
          <div className="sh-team"><div className="sh-flag">🇪🇺</div><div className="sh-tname">EUR</div><div className="sh-score" style={{color:"#FFCD00"}}>{eurW}</div></div>
        </div>
      </div>

      <button className="archive-btn" onClick={()=>setShowArchive(true)}>
        📊 View 2025 Official Results (Golf Genius) →
      </button>
      <div className="card">
        <div className="card-title">📅 Year by Year</div>
        <div className="hist-head">
          <span>Year</span><span>Venue</span><span>Winner</span><span>Captains</span>
        </div>
        {[...HISTORY].reverse().map(h=>(
          <div key={h.year} className="hist-row-full">
            <span className="hr-yr">{h.year}</span>
            <span className="hr-venue">{h.venue}</span>
            <span className={`hr-win ${isUSAWin(h)?"winner-usa":"winner-eur"}`}>{h.w}</span>
            <span className="hr-caps">{h.captains}</span>
          </div>
        ))}
      </div>

      <div className="card" style={{marginTop:10}}>
        <div className="card-title">📉 All-Time Records</div>
        {RECORDS.map((r,i)=>(
          <div key={i} className="rec-row">
            <span className="rec-label">{r.label}</span>
            <span className="rec-val">{r.value}</span>
            <span className="rec-holder">{r.holder}</span>
            <span className="rec-detail">{r.detail}</span>
          </div>
        ))}
      </div>

      <div className="card" style={{marginTop:10}}>
        <div className="card-title">🏅 MVG & 🥴 Ratliff Award History</div>
        <div className="hist-head" style={{gridTemplateColumns:"36px 1fr 1fr"}}>
          <span>Year</span><span>🏅 MVG</span><span>🥴 Ratliff</span>
        </div>
        {[...MVG_HISTORY].reverse().map(h=>(
          <div key={h.year} className="hist-row-full" style={{gridTemplateColumns:"36px 1fr 1fr"}}>
            <span className="hr-yr">{h.year}</span>
            <span className="mvg-name">{h.mvg}{h.mvg===h.rat?" 😬":""}</span>
            <span className="rat-name">{h.rat}</span>
          </div>
        ))}
        <div className="prize-note" style={{marginTop:8}}>★ 2023: Ed won both MVG and Ratliff — a truly historic achievement 😂</div>
      </div>
      <div className="card" style={{marginTop:10}}>
        <div className="card-title">🏆 Most Titles</div>
        {cr.slice(0,8).map((p,i)=>(
          <div key={p.id} className="rank-row">
            <span className="rr-pos">#{i+1}</span>
            <span className="rr-dot" style={{background:p.color}}/>
            <span className="rr-name">{p.name}</span>
            <span className="rr-val" style={{color:p.team==="USA"?"#B22234":"#FFCD00"}}>{p.c.titles}</span>
            <span className="rr-sub">{p.c.years} yrs</span>
          </div>
        ))}
      </div>

      <div className="card" style={{marginTop:10}}>
        <div className="card-title">📊 Best Win % <span style={{fontSize:11,fontWeight:400,color:"#555"}}>(min 3 yrs)</span></div>
        {pr.slice(0,8).map((p,i)=>(
          <div key={p.id} className="rank-row">
            <span className="rr-pos">#{i+1}</span>
            <span className="rr-dot" style={{background:p.color}}/>
            <span className="rr-name">{p.name}</span>
            <span className="rr-val" style={{color:p.team==="USA"?"#B22234":"#FFCD00"}}>{p.pct}%</span>
            <span className="rr-sub">{p.c.w}–{p.c.l}–{p.c.t}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
